name: Release

# Builds the downloadable installers plus their updater metadata, verifies the
# complete cross-platform set, and makes it visible as one GitHub Release.
#
# Windows is built on a WINDOWS RUNNER, and that is not a preference — it is
# forced. Both native modules the daemon needs ship as platform-specific
# optional dependencies (@lydell/node-pty-win32-x64, @parcel/watcher-win32-x64),
# and npm running on Linux will not download the win32 ones. A Windows package
# cross-built from Linux would install fine and then fail the moment a user
# opened a terminal pane or a file tree.
#
# Direct-download artifacts here are UNSIGNED, deliberately (2026-08-02
# decision). Windows SmartScreen can warn about each new unsigned file; a
# device's policy may offer "More info" -> "Run anyway" or may prevent a
# bypass. A conventional signature would establish the publisher and carry
# reputation across releases, but does not guarantee that a new binary avoids
# an initial warning. The separately planned Microsoft Store AppX would receive
# Store signing, but no Store target exists here. macOS is not built: a normal
# direct Mac distribution would require Developer ID signing, notarization,
# packaging, and real-Mac validation. Apple documents a manual unidentified-
# developer override, so the old claim that an unsigned app is categorically
# unusable was inaccurate.
#
# Every GitHub-authored action is pinned to one reviewed commit. There are no
# stored release secrets: publication uses the automatic GITHUB_TOKEN, while
# provenance uses GitHub's short-lived OIDC identity.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # rehearsal — builds and uploads artifacts, no release
    inputs:
      fail_platform:
        description: Intentionally fail one native build to rehearse downstream gating
        required: true
        default: none
        type: choice
        options:
          - none
          - linux
          - windows

# Least privilege by default; only the release job below opts up to write.
#
# This matters because the build job runs electron-builder, which executes
# code from the dependency tree (~400 packages; their lifecycle scripts are
# additionally disabled below, matching CI and Shell intake).
# actions/checkout writes the job's token to disk in the workspace by
# default, so any one of those packages can read it. With a write-scoped token
# a single compromised dependency could push to this repo or replace the
# installers attached to a release — binaries that are unsigned and downloaded
# by strangers, so a tampered asset has nothing else standing behind it.
permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # builds and uploads artifacts; never writes to the repo
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false # one platform failing shouldn't hide the other's result
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            args: --linux
          - name: windows
            os: windows-latest
            args: --win
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/mirafold-empty-npmrc
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    steps:
      # Nothing in this job pushes, so don't leave a credential on disk for the
      # dependency code that runs a few steps below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # A tag that doesn't match package.json is a mis-cut release. The stable
      # feed also refuses prerelease versions outright: a beta must never become
      # `latest` merely because gh defaults to a normal release.
      - name: Stable tag ↔ version check
        if: github.event_name == 'push'
        run: node scripts/release-contract.mjs identity "${{ github.ref_name }}"

      - name: Inject requested rehearsal failure
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.fail_platform == matrix.name
        run: node -e "process.exit(1)"

      # Same script-free install boundary as CI and Shell intake: lifecycle
      # scripts stay disabled (the packaged tree needs none — Electron 43 has no
      # postinstall, and both native modules ship prebuilt), so what electron-
      # builder packages is byte-identical to the signature-verified registry
      # tarballs rather than whatever ~400 packages' install scripts leave
      # behind.
      - name: Use the declared npm release toolchain
        run: |
          set -euo pipefail
          touch "$NPM_CONFIG_USERCONFIG"
          chmod 600 "$NPM_CONFIG_USERCONFIG"
          npm install --global npm@12.0.2 \
            --ignore-scripts \
            --audit=false \
            --fund=false \
            --registry=https://registry.npmjs.org
          test "$(npm --version)" = "12.0.2"

      - name: Install and test exact tagged source
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --audit=false --fund=false \
            --registry=https://registry.npmjs.org
          npm ls --all
          npm audit --audit-level=moderate
          npm audit signatures --include-attestations
          npm test

      # electron-builder downloads the Electron dist it packages by itself, so
      # node_modules/electron/dist is NOT needed here — only the package.json
      # beside it, which npm ci provides. (Electron 43 has no postinstall
      # script; a dev checkout fetches the runtime with `install-electron`.)
      - name: Build installers
        run: node node_modules/electron-builder/cli.js ${{ matrix.args }} --publish never

      - name: Smoke-check the packaged runtime
        run: node scripts/packaged-smoke.mjs "${{ matrix.name }}" dist

      # The unpacked Windows package above proves the exact native modules and
      # daemon lifecycle. This second gate exercises the bytes users actually
      # download: silent /currentuser install, installed-runtime smoke, HKCU
      # (not HKLM) registration, and silent uninstall with no files or registry
      # entry left behind. SmartScreen and visible wizard behavior remain human
      # checks because a runner process cannot observe those interfaces.
      - name: Smoke-check the Windows NSIS install lifecycle
        if: matrix.name == 'windows'
        run: node scripts/windows-installer-smoke.mjs dist

      # This is stronger than upload-artifact's if-no-files-found check, which
      # succeeds when one glob matches even if another required file is absent.
      # It also checks metadata versions, payload SHA-512s/sizes, the AppImage's
      # embedded block map, and Windows' external NSIS blockmap.
      - name: Generate SHA-256 manifest
        run: node scripts/release-contract.mjs manifest "${{ matrix.name }}" dist

      - name: Verify updater artifact set and manifest
        run: node scripts/release-contract.mjs platform "${{ matrix.name }}" dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: |
            dist/SHA256SUMS-*.txt
            dist/latest*.yml
            dist/*.blockmap
            dist/*.deb
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.exe
          if-no-files-found: error
          # Installers are already compressed. Recompressing ~1 GB of binaries
          # costs runner time without materially reducing artifact storage.
          compression-level: 0
          retention-days: 7

  attest:
    name: attest release provenance
    needs: build
    runs-on: ubuntu-latest
    # OIDC and attestation writes exist only here, after dependency code and
    # native packaging have finished in separate read-only jobs.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/mirafold-release-assets
          merge-multiple: true

      - name: Verify exact subjects before attesting
        run: >-
          node scripts/release-contract.mjs artifacts
          "${{ runner.temp }}/mirafold-release-assets"

      - name: Generate SLSA build provenance for all nine release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/mirafold-release-assets/*

  release:
    name: publish release
    needs: [build, attest]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: manual-release
    permissions:
      contents: write # create the Release and upload assets — the only job that needs it
    concurrency:
      group: mirafold-desktop-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gh receives its token through GH_TOKEN below; a persistent Git
          # credential is unnecessary even in the write-capable job.
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # No npm install occurs in this job. The verifier is Node-standard-library
      # only, so dependency code never runs beside the repository-write token.
      - name: Verify complete release set
        run: node scripts/release-contract.mjs complete "${{ github.ref_name }}" artifacts

      - name: Publish complete GitHub Release atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists — refusing to replace it" >&2
            exit 1
          fi

          created=false
          cleanup_draft() {
            if [ "$created" = true ]; then
              gh release delete "$RELEASE_TAG" --yes || true
            fi
          }
          trap cleanup_draft EXIT

          gh release create "$RELEASE_TAG" \
            --draft \
            --latest=false \
            --verify-tag \
            --title "Mirafold Desktop $RELEASE_TAG" \
            --notes-file .github/RELEASE_NOTES.md
          created=true

          gh release upload "$RELEASE_TAG" artifacts/*
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '{tagName:.tag_name,isDraft:.draft,isPrerelease:.prerelease,assets:[.assets[]|{name,size,digest}]}' \
            > "$RUNNER_TEMP/mirafold-release.json"
          node scripts/release-contract.mjs \
            draft "$RELEASE_TAG" artifacts "$RUNNER_TEMP/mirafold-release.json"

          # From here an uncertain network response must not trigger cleanup:
          # the draft is already complete, and this request may have published
          # it even if the runner does not receive the success response.
          created=false
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --prerelease=false \
            --latest
          trap - EXIT

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '{tagName:.tag_name,isDraft:.draft,isPrerelease:.prerelease,assets:[.assets[]|{name,size,digest}]}' \
            > "$RUNNER_TEMP/mirafold-release-public.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '{tagName:.tag_name,isDraft:.draft,isPrerelease:.prerelease}' \
            > "$RUNNER_TEMP/mirafold-release-latest.json"
          node scripts/release-contract.mjs published \
            "$RELEASE_TAG" artifacts \
            "$RUNNER_TEMP/mirafold-release-public.json" \
            "$RUNNER_TEMP/mirafold-release-latest.json"
